name: Build Windows exe
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v
      - run: python deploy/version_info.py build/version_info.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon assets/DizzyDoctor.ico --version-file build/version_info.txt --add-data "assets/DizzyDoctor.ico;assets" --collect-submodules keyring --name DizzyDoctor --collect-all webview --hidden-import webview.platforms.edgechromium --collect-all winrt --collect-all pymupdf --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --add-data "recordfinder/charting/web;recordfinder/charting/web" --add-data "recordfinder/charting/templates;recordfinder/charting/templates" --add-data "recordfinder/charting/note_schema.json;recordfinder/charting" --hidden-import win32timezone main.py
      - name: Start the built exe once (self-test) and check its name and version
        shell: pwsh
        timeout-minutes: 5
        run: |
          Start-Process -FilePath dist\DizzyDoctor.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if ($r.charting_error -or -not $r.note_fields) { throw "the note form did not fill in the built exe" }
          $v = (Get-Item dist\DizzyDoctor.exe).VersionInfo
          if ($v.ProductName -ne 'DizzyDoctor') { throw "the exe has no DizzyDoctor version resource" }
          "Built $($v.ProductName) $($v.ProductVersion), $([math]::Round((Get-Item dist\DizzyDoctor.exe).Length / 1MB)) MB"
      - uses: actions/upload-artifact@v4
        with:
          name: DizzyDoctor
          path: |
            dist/DizzyDoctor.exe
            deploy/Install DizzyDoctor.cmd
      - name: Publish tagged build for automatic updates
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "DizzyDoctor $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME dist\DizzyDoctor.exe "deploy\Install DizzyDoctor.cmd" --clobber
