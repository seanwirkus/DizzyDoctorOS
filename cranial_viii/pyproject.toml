[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cranial-viii"
version = "0.1.0"
description = "Sovereign, offline clinical AI and automated medical record/fax pipeline for otoneurology and neurology."
readme = "README.md"
authors = [{ name = "Sean Wirkus" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "pymupdf>=1.24.0",
    "rapidfuzz>=3.8.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
    "typer[all]>=0.12.3",
    "rich>=13.7.1"
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.3.0"
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.4.0",
    "ruff>=0.4.0"
]

[project.scripts]
cranial = "cli:app"
